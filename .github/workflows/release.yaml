name: Release

# A tag like v1.0.0-rc.1.nh.1 builds both Linux binaries and publishes them, with their SHA-256 sums, as a
# GitHub release. The node agent installs a release by its tag and checks the sum before swapping the binary.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        env:
          CGO_ENABLED: 0
        run: go test ./...

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          for ARCH in amd64 arm64; do
            GOOS=linux GOARCH=$ARCH go build -o dist/wings_linux_$ARCH -v -trimpath \
              -ldflags="-s -w -X github.com/pelican/wings/system.Version=${VERSION}" github.com/pelican/wings
          done
          chmod 755 dist/*

      - name: Checksums and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum wings_linux_amd64 wings_linux_arm64) > checksums.txt
          # This release's section of CHANGELOG-NEXTHOST.md, then the upstream base and the sums
          awk -v heading="## ${TAG}" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG-NEXTHOST.md > RELEASE_NOTES.md
          {
            echo ""
            echo "Upstream base: $(sed -n 's/^Base: //p' UPSTREAM.md)"
            echo ""
            echo '#### SHA256'
            echo '```'
            cat checksums.txt
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: |
            dist/wings_linux_amd64
            dist/wings_linux_arm64
            checksums.txt
